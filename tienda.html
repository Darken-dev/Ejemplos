<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="base.css"><title>Tienda online</title><style>header{background:#352a22;color:#fff;text-align:center;padding:34px 5%;display:flex;justify-content:space-between;align-items:center}header h1{font-size:clamp(30px,5vw,56px);letter-spacing:.06em}.cart{background:#fff;color:#352a22;padding:8px 16px;border-radius:99px;font-weight:700}.pc{padding:0;overflow:hidden;border-color:#352a22}.im{height:170px;display:flex;align-items:center;justify-content:center;font-size:4rem}.pi{padding:14px}.pi div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;padding:6px 0}.d{width:20px;height:20px;border-radius:50%;display:inline-block;margin-left:6px}.btn{background:#352a22;width:100%;margin-top:10px}</style></head><body>
<header><h1>CATÁLOGO DE PRODUCTOS</h1><span class="cart">🛒 <span id="n">0</span></span></header>
<section><div class="grid" id="g"></div></section>
<script>
const P=[["Sillón cuero","🛋️","#6b5144","#352a22,#8a7468,#bdb5ac","$320.000"],["Butaca azul","💺","#cfe0ff","#b8272d,#333,#0a2f78","$145.000"],["Diván verde","🛋️","#b9e87a","#b5ada2,#7f8566,#e0e4d2","$410.000"],["Esquinero","🛋️","#eee","#3c5a32,#8aac5e,#bdb5ac","$690.000"],["Escritorio","🪑","#f1e3d0","#352a22,#7b6a5e,#bdb5ac","$210.000"],["Sofá mostaza","🛋️","#efe28a","#9a7b32,#7b6a5e,#bdb5ac","$380.000"]];
let c=0;g.innerHTML=P.map(p=>'<div class="card pc"><div class="im" style="background:'+p[2]+'">'+p[1]+'</div><div class="pi"><div><b>'+p[0]+'</b><span>'+p[4]+'</span></div><div>Tamaño<span>2 Mts</span></div><div>Colores<span>'+p[3].split(",").map(x=>'<i class="d" style="background:'+x+'"></i>').join("")+'</span></div><button class="btn">Agregar al carrito</button></div></div>').join("");
g.onclick=e=>{if(e.target.tagName=="BUTTON"){n.textContent=++c;e.target.textContent="✓ Agregado"}}
</script><a class="back" href="index.html">← Volver al portafolio</a></body></html>
